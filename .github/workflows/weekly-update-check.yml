name: 週次更新チェック

on:
  schedule:
    # 毎週月曜日 午前9時（JST）= 日曜日 24時（UTC）
    - cron: '0 0 * * 0'
  workflow_dispatch:  # 手動実行も可能

jobs:
  weekly-update-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      actions: read
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    
    - name: Claude Code - weekly scan
      uses: anthropics/claude-code-base-action@beta
      with:
        claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        model: "claude-opus-4-20250514"
        prompt: |
          **週次更新チェック実行:** `/update_rp_info check`
          
          **簡潔に以下のみ報告:**
          1. ✅重要な更新: あり/なし
          2. 🎯推奨アクション: 不要/quick/full
          3. 📊注目プログラム: 3件以内
          
          **必須:** 結果をMarkdownファイルに保存: `.github/weekly-update-result.md`
        
        append_system_prompt: |
          **出力要件:**
          - 日本語で5行以内の超簡潔な応答
          - 結論を最初に明記
          - 詳細なプロセスログは一切表示しない
          - 結果をMarkdownファイルとして保存
          
          **重要:** MCO-010(BLA申請中)、OCU400(Phase3)、VP-001(Phase2/3予定)の状況のみ確認
        
        allowed_tools: |
          Bash(python scripts/*)
          Bash(python src/*)
          Bash(echo *)
          Write
        timeout_minutes: 30
    
    - name: Create GitHub Issue
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const fs = require('fs');
          const date = new Date().toISOString().split('T')[0];
          
          // Markdownファイルから結果を読み込む
          let content = '';
          try {
            content = fs.readFileSync('.github/weekly-update-result.md', 'utf8');
          } catch (error) {
            content = '## 週次更新チェック結果\n\n更新チェックの実行中にエラーが発生しました。';
          }
          
          // Issueを作成
          await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: `📅 週次更新チェック結果 - ${date}`,
            body: content
          });