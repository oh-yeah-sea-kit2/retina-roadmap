name: 週次更新チェック

on:
  schedule:
    # 毎週月曜日 午前9時（JST）= 日曜日 24時（UTC）
    - cron: '0 0 * * 0'
  workflow_dispatch:  # 手動実行も可能

jobs:
  weekly-update-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      actions: read
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    
    - name: Claude Code - weekly scan
      id: claude_scan
      uses: anthropics/claude-code-base-action@beta
      with:
        claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        model: "claude-opus-4-20250514"
        prompt: |
          **週次更新チェック実行:** `/update_rp_info check`
          
          **以下の形式で結果を出力してください:**
          ```markdown
          ## 週次更新チェック結果
          
          **実行日:** YYYY-MM-DD
          
          ### 📊 結果サマリー
          
          1. **✅重要な更新:** [あり/なし]
          2. **🎯推奨アクション:** [不要/quick/full]
          3. **📊注目プログラム:**
             - プログラム1: 状況
             - プログラム2: 状況
             - プログラム3: 状況
          
          ### 詳細
          [簡潔な説明]
          ```
        
        append_system_prompt: |
          **出力要件:**
          - 日本語で応答
          - Markdownフォーマットで構造化された出力を生成
          - 詳細なプロセスログは一切表示しない
          - 最後に上記のMarkdown形式の結果のみを出力
          
          **重要:** MCO-010(BLA申請中)、OCU400(Phase3)、VP-001(Phase2/3予定)の状況のみ確認
        
        allowed_tools: |
          Bash(python scripts/*)
          Bash(python src/*)
          WebSearch
          Read
        timeout_minutes: 30
    
    - name: Create GitHub Issue
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const date = new Date().toISOString().split('T')[0];
          
          // Claude Codeの出力から結果を抽出
          const claudeOutput = `${{ steps.claude_scan.outputs.result || '' }}`;
          
          // Markdownブロックを抽出（```markdown から ``` まで）
          const markdownMatch = claudeOutput.match(/```markdown\n([\s\S]*?)\n```/);
          let content = '';
          
          if (markdownMatch && markdownMatch[1]) {
            content = markdownMatch[1].trim();
          } else {
            // Markdownブロックが見つからない場合は、全体の出力を使用
            content = claudeOutput || '## 週次更新チェック結果\n\n更新チェックの実行中にエラーが発生しました。';
          }
          
          // Issueを作成
          await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: `📅 週次更新チェック結果 - ${date}`,
            body: content
          });