name: 週次更新チェック

on:
  schedule:
    # 毎週月曜日 午前9時（JST）= 日曜日 24時（UTC）
    - cron: '0 0 * * 0'
  workflow_dispatch:  # 手動実行も可能

jobs:
  create-check-issue:
    runs-on: ubuntu-latest
    
    steps:
    - name: 現在の日付を取得
      id: date
      run: echo "date=$(TZ=Asia/Tokyo date +'%Y年%m月%d日')" >> $GITHUB_OUTPUT
    
    - name: 今週のIssueが既に存在するか確認
      id: check-existing
      run: |
        # 今週の月曜日の日付を取得
        MONDAY=$(TZ=Asia/Tokyo date -d "monday this week" +'%Y年%m月%d日' 2>/dev/null || TZ=Asia/Tokyo date +'%Y年%m月%d日')
        
        # 既存のIssueを検索
        EXISTING=$(gh issue list \
          --label "automation,update-check" \
          --state open \
          --json number,title,createdAt \
          --jq ".[] | select(.title | contains(\"$MONDAY\")) | .number" \
          | head -1)
        
        echo "existing_issue=$EXISTING" >> $GITHUB_OUTPUT
        echo "monday_date=$MONDAY" >> $GITHUB_OUTPUT
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: 週次チェック用Issueを作成
      if: steps.check-existing.outputs.existing_issue == ''
      run: |
        gh issue create \
          --title "📅 週次更新チェック - ${{ steps.check-existing.outputs.monday_date }}" \
          --body "@claude 

網膜色素変性症の治療情報について、週次更新チェックをお願いします。

以下のコマンドを実行して、最新情報を確認してください：
\`\`\`
/update_rp_info check
\`\`\`

チェック結果に基づいて：
1. 重要な更新があるかを報告してください
2. 更新が必要な場合は、推奨アクション（quick または full）を提案してください
3. 特に注目すべき治療プログラムの進展があれば強調してください

---
*このIssueは毎週月曜日に自動的に作成されます。*" \
          --label "automation,update-check"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: 既存のIssueにリマインダーコメントを追加
      if: steps.check-existing.outputs.existing_issue != ''
      run: |
        gh issue comment ${{ steps.check-existing.outputs.existing_issue }} \
          --body "## 🔔 週次チェックリマインダー

@claude 

今週の更新チェックをお願いします。前回のチェックから新しい情報があるか確認してください。

\`/update_rp_info check\` を実行してください。

---
*${{ steps.date.outputs.date }} - 自動リマインダー*"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}