name: 週次更新チェック

on:
  schedule:
    # 毎週月曜日 午前9時（JST）= 日曜日 24時（UTC）
    - cron: '0 0 * * 0'
  workflow_dispatch:  # 手動実行も可能

jobs:
  weekly-update-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      actions: read
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    
    - name: Run weekly update check
      id: check_result
      run: |
        # 週次更新チェックを実行
        python scripts/update_latest_info.py check > check_output.txt 2>&1 || true
        
        # 結果を抽出
        if grep -q "📊 更新チェック結果サマリー" check_output.txt; then
          # 結果サマリーが含まれている場合
          echo "check_success=true" >> $GITHUB_OUTPUT
          # 結果をファイルに保存
          sed -n '/📊 更新チェック結果サマリー/,/^$/p' check_output.txt > summary.txt
          
          # 重要な更新の有無を確認
          if grep -q "重要な更新: [1-9]" summary.txt; then
            echo "has_updates=true" >> $GITHUB_OUTPUT
          else
            echo "has_updates=false" >> $GITHUB_OUTPUT
          fi
          
          # 推奨アクションを抽出
          if grep -q "quick" check_output.txt; then
            echo "recommended_action=quick" >> $GITHUB_OUTPUT
          elif grep -q "full" check_output.txt; then
            echo "recommended_action=full" >> $GITHUB_OUTPUT
          else
            echo "recommended_action=none" >> $GITHUB_OUTPUT
          fi
        else
          echo "check_success=false" >> $GITHUB_OUTPUT
          echo "has_updates=false" >> $GITHUB_OUTPUT
          echo "recommended_action=error" >> $GITHUB_OUTPUT
        fi
    
    - name: Format check result
      id: format_result
      run: |
        # 結果をMarkdown形式で整形
        DATE=$(date +"%Y-%m-%d")
        
        if [ "${{ steps.check_result.outputs.check_success }}" = "true" ]; then
          # 成功時のレポート
          cat > issue_content.md <<EOF
## 週次更新チェック結果

**実行日:** ${DATE}

### 📊 結果サマリー

EOF
          # サマリーを追加
          if [ -f summary.txt ]; then
            cat summary.txt >> issue_content.md
          fi
          
          # 推奨アクションを追加
          echo "" >> issue_content.md
          echo "### 🎯 推奨アクション" >> issue_content.md
          
          if [ "${{ steps.check_result.outputs.has_updates }}" = "true" ]; then
            echo "" >> issue_content.md
            echo "重要な更新が見つかりました。以下のコマンドで詳細を確認してください：" >> issue_content.md
            echo "\`\`\`bash" >> issue_content.md
            if [ "${{ steps.check_result.outputs.recommended_action }}" = "quick" ]; then
              echo "python scripts/update_latest_info.py quick" >> issue_content.md
            else
              echo "python scripts/update_latest_info.py full" >> issue_content.md
            fi
            echo "\`\`\`" >> issue_content.md
          else
            echo "" >> issue_content.md
            echo "重要な更新はありませんでした。" >> issue_content.md
          fi
          
          # 詳細情報を追加
          echo "" >> issue_content.md
          echo "### 🔍 詳細" >> issue_content.md
          echo "" >> issue_content.md
          echo "<details>" >> issue_content.md
          echo "<summary>チェックログを表示</summary>" >> issue_content.md
          echo "" >> issue_content.md
          echo "\`\`\`" >> issue_content.md
          tail -50 check_output.txt >> issue_content.md
          echo "\`\`\`" >> issue_content.md
          echo "</details>" >> issue_content.md
        else
          # エラー時のレポート
          cat > issue_content.md <<EOF
## 週次更新チェック結果

**実行日:** ${DATE}

### ⚠️ エラー

更新チェックの実行中にエラーが発生しました。

### 対応方法

手動で以下のコマンドを実行してください：
\`\`\`bash
python scripts/update_latest_info.py check
\`\`\`

### エラーログ

<details>
<summary>エラー詳細を表示</summary>

\`\`\`
EOF
          tail -50 check_output.txt >> issue_content.md
          echo "\`\`\`" >> issue_content.md
          echo "</details>" >> issue_content.md
        fi
    
    - name: Create GitHub Issue
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const fs = require('fs');
          const date = new Date().toISOString().split('T')[0];
          
          // issue_content.mdを読み込む
          const content = fs.readFileSync('issue_content.md', 'utf8');
          
          // Issueを作成
          await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: `📅 週次更新チェック結果 - ${date}`,
            body: content
          });