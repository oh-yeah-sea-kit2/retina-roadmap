name: 週次更新チェック

on:
  schedule:
    # 毎週月曜日 午前9時（JST）= 日曜日 24時（UTC）
    - cron: '0 0 * * 0'
  workflow_dispatch:  # 手動実行も可能

jobs:
  weekly-update-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      actions: read
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    
    - name: Run Claude Code for weekly update check
      uses: anthropics/claude-code-action@beta
      with:
        claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        
        model: "claude-opus-4-20250514"
        
        # Claude Codeに週次更新チェックの指示を与える
        prompt: |
          網膜色素変性症の治療情報について、週次更新チェックを行ってください。
          
          以下のコマンドを実行して、最新情報を確認してください：
          /update_rp_info check
          
          チェック結果に基づいて：
          1. 重要な更新があるかを報告してください
          2. 更新が必要な場合は、推奨アクション（quick または full）を提案してください
          3. 特に注目すべき治療プログラムの進展があれば強調してください
          
          結果をGitHub Issueとして作成し、今週の週次更新チェック結果として報告してください。
          Issue作成時は以下のタイトルを使用してください：
          「📅 週次更新チェック結果 - [今日の日付]」
        
        allowed_tools: |
          Bash(python scripts/*)
          Bash(python src/*)
          Bash(git status)
          Bash(git diff)
        
        custom_instructions: |
          このプロジェクトは網膜色素変性症の治療予測システムです。
          必ず日本語で応答してください。
          週次更新チェックでは以下を重視してください：
          - 新規の治療プログラムの追加
          - Phase進行（特にPhase 3への移行）
          - BLA申請の開始
          - 試験の成功/失敗の発表
          - 規制当局からの重要な発表
          結果は詳細で分かりやすくGitHub Issueとして報告してください。