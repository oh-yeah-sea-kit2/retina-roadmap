name: 週次更新チェック

on:
  schedule:
    # 毎週月曜日 午前9時（JST）= 日曜日 24時（UTC）
    - cron: '0 0 * * 0'
  workflow_dispatch:  # 手動実行も可能

jobs:
  weekly-update-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      actions: read
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    
    - name: Claude Code - weekly scan
      uses: anthropics/claude-code-base-action@beta
      with:
        claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        model: "claude-opus-4-20250514"
        prompt: |
          **週次更新チェック実行:** `/update_rp_info check`
          
          **簡潔に以下のみ報告:**
          1. ✅重要な更新: あり/なし
          2. 🎯推奨アクション: 不要/quick/full
          3. 📊注目プログラム: 3件以内
          
          **必須:** 結果をGitHub Issue「📅 週次更新チェック結果 - [今日の日付]」として作成
        
        append_system_prompt: |
          **出力要件:**
          - 日本語で5行以内の超簡潔な応答
          - 結論を最初に明記
          - 詳細なプロセスログは一切表示しない
          - GitHub Issue作成を最優先で実行
          
          **重要:** MCO-010(BLA申請中)、OCU400(Phase3)、VP-001(Phase2/3予定)の状況のみ確認
        
        allowed_tools: |
          Bash(python scripts/*)
          Bash(python src/*)
          Bash(gh issue create)
          Bash(gh issue list)
          Bash(echo *)
          Write
        timeout_minutes: 30