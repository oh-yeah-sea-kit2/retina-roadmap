name: 週次更新チェック

on:
  schedule:
    # 毎週月曜日 午前9時（JST）= 日曜日 24時（UTC）
    - cron: '0 0 * * 0'
  workflow_dispatch:  # 手動実行も可能

jobs:
  weekly-update-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      actions: read
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    
    - name: Claude Code - weekly scan
      uses: anthropics/claude-code-base-action@beta
      with:
        claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        model: "claude-opus-4-20250514"
        prompt: |
          網膜色素変性症の治療情報について週次更新チェックを実行してください。
          
          /update_rp_info check を実行した上で、以下を報告してください：
          1. 重要な更新の有無
          2. 必要なら推奨アクション（quick/full）
          3. 注目すべき治療プログラム進展
          
          結果をGitHub Issue「📅 週次更新チェック結果 - [今日の日付]」として作成してください。
        
        append_system_prompt: |
          このプロジェクトは網膜色素変性症の治療予測システムです。
          日本語で簡潔に応答してください。
          重視ポイント: 新規治療プログラム / Phase 3進行 / BLA申請 / 試験成功・失敗 / 規制当局の発表
        
        allowed_tools: Bash(python scripts/*), Bash(python src/*), Bash(git status), Bash(git diff)
        timeout_minutes: 30