# シミュレーション設定ファイル
# ハードコードされていた日付・パラメータを集約

# 成功率ポリシー
# - raw_success_rate: 出典から得たフェーズ別ヒストリカル成功率
# - success_rate: 表示・計算に使う上限キャップ適用後の値
# - cumulative_approval_probability: 現在フェーズ以降のsuccess_rateを掛け合わせた値
success_rate_policy:
  display_cap: 0.85
  source_label: "Project-calibrated RP phase historical rates from ClinicalTrials.gov status data"
  source_url: "https://clinicaltrials.gov/search?cond=Retinitis%20Pigmentosa"
  methodology_sources:
    - label: "Wong, Siah & Lo, Biostatistics 2019 - phase-transition probability framework"
      url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC6409418/"
    - label: "BIO/Informa/QLS Clinical Development Success Rates 2011-2020 - phase transition benchmark report"
      url: "https://www.bio.org/clinical-development-success-rates-and-contributing-factors-2011-2020"
  note: "数値はRP関連試験スナップショットから算出したプロジェクト校正値。Wong et al.およびBIO/Informa/QLSのフェーズ遷移確率の考え方に合わせ、個別試験の承認確率ではなく残フェーズの累積確率として使う。100%表示を避けるため、表示・計算に使う値には上限を適用する。"

phase_historical_success_rates:
  PHASE1:
    success_rate: 0.86
    label: "Phase 1"
  PHASE2:
    success_rate: 0.78
    label: "Phase 2"
  PHASE3:
    success_rate: 0.71
    label: "Phase 3"

# 日本承認遅延パラメータ（Luxturna実績: 5.5年に基づく）
japan_delay_years:
  min: 3.0       # 楽観的シナリオ
  median: 5.0    # 標準シナリオ
  max: 7.0       # 保守的シナリオ

# MCO-010 日本承認遅延パラメータ
# 2026-10-01: PMDAが承認申請を受理し優先審査（先駆け指定）。会社は日米とも2027年前半に結果の可能性と説明。
# 米国とほぼ同時審査のため、遅れは0〜1年に置く（審査が長引く場合を保守側に含める）。
japan_delay_years_sakigake:
  min: 0.0       # 日米同時期に結果が出る場合
  median: 0.25   # 日本が少し遅れる場合
  max: 1.0       # 保守的シナリオ

# プログラム固有の設定
programs:
  MCO-010:
    match_fields:
      brief_title_keywords: ["MCO-010", "MCO010"]
      nct_ids: ["NCT04945772"]
      sponsor_keywords: ["Nanoscope"]
    # FDAがBLAを受理（2026-09-09報道）。優先審査の対象で、会社は2027年前半に結果の可能性と説明。
    bla_complete_date: "2026-09-09"
    review_time:
      min: 0.5
      median: 0.67
      max: 0.83
    confidence: "very_high"
    fast_track: true
    gene_agnostic: true
    japan_sakigake: true
    program_name: "MCO-010"

  OCU400:
    match_fields:
      brief_title_keywords: ["OCU400", "OCU-400"]
      nct_ids: ["NCT05203939", "NCT06388200"]
      sponsor_keywords: ["Ocugen"]
    # 2026年8月の会社開示: 段階的申請（rolling BLA）の開始は、2027年第1四半期予定のトップライン結果が出てからとFDAが確認。
    # 申請完了は結果公表の後になるため、2027年半ばと仮定する（会社の確定日程ではない）。
    submission_date: "2027-06-30"
    review_time:
      min: 0.83
      median: 1.0
      max: 1.17
    confidence: "high"
    gene_agnostic: true
    rmat_designated: true
    program_name: "OCU400"

  Botaretigene:
    match_fields:
      nct_ids: ["NCT04671433", "NCT04794101", "NCT05926583"]
      brief_title_keywords: ["Botaretigene", "bota-vec", "AAV5-hRKp.RPGR"]
      sponsor_keywords: ["MeiraGTx", "Janssen"]
    # LUMEOSは主要評価未達だがMeiraGTxが取得し、米欧日申請を進める方針。
    # 副次評価の支持と主要評価未達の不確実性を併せ、通常のPhase 3成功率より保守的に置く。
    success_rate: 0.5
    submission_date: "2026-12-31"
    submission_time:
      min: 0.25
      median: 0.5
      max: 1.0
    review_time:
      min: 0.75
      median: 1.0
      max: 1.5
    confidence: "medium_low"
    program_name: "Botaretigene sparoparvovec"

  VP-001:
    match_fields:
      brief_title_keywords: ["VP-001", "VP001"]
      sponsor_keywords: ["PYC"]
    phase23_start_date: "2025-10-01"
    phase23_duration:
      min: 2.0
      median: 2.5
      max: 3.0
    analysis_time:
      min: 0.5
      median: 0.75
      max: 1.0
    review_time:
      min: 1.0
      median: 1.25
      max: 1.5
    confidence: "medium"
    rna_therapy: true
    program_name: "VP-001"

  AGTC-501:
    match_fields:
      brief_title_keywords: ["AGTC-501", "AGTC501"]
      nct_ids: ["NCT04850118", "NCT06275620", "NCT06333249", "NCT06646289"]
      sponsor_keywords: ["Beacon"]
    # 2026-09-21: 最終試験VISTAが主要評価項目を達成。年内に段階的申請（rolling BLA）の開始を計画。
    # 試験は終わっているので残り期間をほぼ0に置き、analysis_time を「申請完了までの期間」として使う。
    # 残るリスクは申請・審査なので、成功確率は表示・計算上限の0.85に置く。
    success_rate: 0.85
    phase23_duration:
      min: 0.0
      median: 0.1
      max: 0.25
    analysis_time:
      min: 0.5
      median: 0.75
      max: 1.0
    review_time:
      min: 0.75
      median: 1.0
      max: 1.5
    confidence: "high"
    xlrp_specific: true
    program_name: "AGTC-501"

# CDF プロット年範囲
cdf_year_range:
  start: 2025
  end: 2041

# ウォーターフォールチャート基準年
waterfall_base_year: 2025
